<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Болотная тусовка — OBS</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="stage" width="1920" height="1080" aria-label="Болотная тусовка — анимированный OBS-оверлей"></canvas>
<section id="hud" hidden><header><strong>БОЛОТНАЯ ТУСОВКА</strong><span>DEMO / не живые данные</span></header><p id="status">Загрузка…</p><div class="stats"><span id="viewers"></span><span id="uptime"></span><span id="crowd"></span></div><div class="actions"><button data-action="run">Следующий [E]</button><button data-action="ltr">Слева → направо [L]</button><button data-action="rtl">Справа → налево [R]</button><button data-action="viewers">+5 зрителей [V]</button><button data-action="uptime">+30 мин эфира [T]</button><button data-action="watch">+30 мин чата [W]</button><button data-action="hop">Прыжок [H]</button><button data-action="speech">Mrglgl [M]</button><button data-action="splash">Брызги [S]</button><button data-action="background">Фон [B]</button><button data-action="chatters">Ники [N]</button><button data-action="chat-message">Сообщение [Q]</button><button data-action="clear-chatters">Убрать ники [C]</button></div><p id="event-log"></p><small>Без demo панель и горячие клавиши выключены. Прозрачный верх. Пауза [P].</small></section>
<div id="error" role="alert" hidden></div><script type="module" src="app.js"></script></body></html>
